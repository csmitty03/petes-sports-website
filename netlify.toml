[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NUXT_PUBLIC_SUPABASE_ANON_KEY,NUXT_SUPABASE_SERVICE_ROLE_KEY,NUXT_PUBLIC_SUPABASE_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/staff"
  to = "/staff/login/index.html"
  status = 200

[[redirects]]
  from = "/staff/*"
  to = "/staff/login/index.html"
  status = 200